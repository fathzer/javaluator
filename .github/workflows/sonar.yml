# This workflow performs the SonarCloud analysis.
# It is triggered by the completion of the "Build" workflow instead of directly by
# push/pull_request events, so that it runs in the context of the base repository
# and has access to the SONAR_TOKEN secret, even for pull requests coming from
# forks (which no longer receive repository secrets and variables).
# It analyzes the artifacts produced by the build workflow. Maven is intentionally
# not used here: running it would load the pull request pom files and could leak
# secrets if a malicious pull request declared a rogue Maven extension.
name: Sonar
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
permissions:
  contents: read
  actions: read # Required to download the artifacts of the triggering workflow run
  pull-requests: read # Required to get pull request information
jobs:
  analyze:
    name: Analyze
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Checkout the exact code that was built, not the default branch
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'zulu' # Required by the sonar-scanner runtime
      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download pull request information
        uses: actions/download-artifact@v8
        with:
          name: pr-info
          path: pr-info
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true # This artifact does not exist when the build was triggered by a push
      - name: Compute Sonar arguments
        id: sonar-args
        run: |
          if [ -f pr-info/number ]; then
            echo "args=-Dsonar.pullrequest.key=$(cat pr-info/number) -Dsonar.pullrequest.branch=$(cat pr-info/head) -Dsonar.pullrequest.base=$(cat pr-info/base)" >> "$GITHUB_OUTPUT"
          else
            echo "args=-Dsonar.branch.name=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Analyze
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # The following settings were previously defined in the "sonar" maven profile
          args: |
            -Dsonar.projectKey=fathzer_javaluator
            -Dsonar.organization=fathzer
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=javaluator/src/main/java,javaluator-examples/src/main/java,javaluator-demo/src/main/java
            -Dsonar.tests=javaluator/src/test/java,javaluator-examples/src/test/java
            -Dsonar.java.binaries=javaluator/target/classes,javaluator-examples/target/classes,javaluator-demo/target/classes
            -Dsonar.java.test.binaries=javaluator/target/test-classes,javaluator-examples/target/test-classes
            -Dsonar.java.libraries=javaluator-examples/target/dependency,javaluator-demo/target/dependency
            -Dsonar.java.test.libraries=javaluator/target/dependency,javaluator-examples/target/dependency,javaluator/target/classes,javaluator-examples/target/classes
            -Dsonar.java.source=11
            -Dsonar.java.target=11
            -Dsonar.coverage.jacoco.xmlReportPaths=javaluator/target/site/jacoco/jacoco.xml,javaluator-examples/target/site/jacoco/jacoco.xml
            -Dsonar.junit.reportPaths=javaluator/target/surefire-reports,javaluator-examples/target/surefire-reports
            -Dsonar.issue.ignore.multicriteria=e1,e3
            -Dsonar.issue.ignore.multicriteria.e1.ruleKey=java:S106
            -Dsonar.issue.ignore.multicriteria.e1.resourceKey=javaluator-examples/**/*
            -Dsonar.issue.ignore.multicriteria.e3.ruleKey=java:S1948
            -Dsonar.issue.ignore.multicriteria.e3.resourceKey=javaluator-demo/**/*
            -Dsonar.coverage.exclusions=javaluator-demo/**
            -Dsonar.cpd.exclusions=javaluator-examples/**/*.java
            ${{ steps.sonar-args.outputs.args }}
